name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core lint, typecheck, test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @cookie-agent/core lint

      - name: Typecheck
        run: pnpm --filter @cookie-agent/core typecheck

      - name: Test
        run: pnpm --filter @cookie-agent/core test

  app:
    name: Swift package (macOS)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile drive-mac AppleScript
        run: .cursor/skills/verify-cookie/bin/compile-drive-mac-scripts

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Swift package
        env:
          COOKIE_REQUIRE_FAKE_CORE: "1"
        run: |
          swift --version
          swift test --package-path app

      - name: Package Cookie Agent.app
        run: app/Scripts/package-app.sh "${{ runner.temp }}/Cookie Agent.app"
