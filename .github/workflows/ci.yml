name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core lint, typecheck, test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @cookie-agent/core lint

      - name: Typecheck
        run: pnpm --filter @cookie-agent/core typecheck

      - name: Test
        run: pnpm --filter @cookie-agent/core test

  app:
    name: Swift package (macOS)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Swift package
        run: |
          if [ -f app/Package.swift ]; then
            swift --version
            swift build --package-path app
          else
            echo "No Swift package at app/Package.swift; nothing to build."
          fi
