name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core lint, typecheck, test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @cookie-agent/core lint

      - name: Typecheck
        run: pnpm --filter @cookie-agent/core typecheck

      - name: Test
        run: pnpm --filter @cookie-agent/core test

  app:
    name: Swift package (macOS)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile drive-mac AppleScript
        run: .cursor/skills/verify-cookie/bin/compile-drive-mac-scripts

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Swift package
        env:
          COOKIE_REQUIRE_FAKE_CORE: "1"
        run: |
          swift --version
          swift test --package-path app

      - name: Package Cookie Agent.app
        run: app/Scripts/package-app.sh "${{ runner.temp }}/Cookie Agent.app"

  type-strip-warning:
    name: Type-stripping stderr (Node 22.13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22.13
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Type-stripping warning stays off stderr
        env:
          COOKIE_EXPECT_TYPE_STRIP_WARNING: "1"
        run: node core/scripts/check-type-strip-stderr.mjs

  sqlite-spike:
    name: node:sqlite spike (Node 22.13, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: macos-26
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22.13
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require runner architecture
        run: |
          echo "runner.os=${{ runner.os }} runner.arch=${{ runner.arch }} uname=$(uname -m)"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            test "$(uname -m)" = "arm64"
            test "${{ runner.arch }}" = "ARM64"
          else
            test "$(uname -m)" = "x86_64"
            test "${{ runner.arch }}" = "X64"
          fi

      - name: Spike node:sqlite
        run: pnpm spike-sqlite
