name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core lint, typecheck, test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint drive-mac targeting
        run: .cursor/skills/verify-cookie/bin/lint-drive-mac-targeting

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @cookie-agent/core lint

      - name: Typecheck
        run: pnpm --filter @cookie-agent/core typecheck

      - name: Test
        run: pnpm --filter @cookie-agent/core test

  app:
    name: Swift package (macOS)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint drive-mac targeting
        run: .cursor/skills/verify-cookie/bin/lint-drive-mac-targeting

      - name: Compile drive-mac AppleScript
        run: .cursor/skills/verify-cookie/bin/compile-drive-mac-scripts

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Swift package
        env:
          COOKIE_REQUIRE_FAKE_CORE: "1"
        run: |
          swift --version
          swift test --package-path app

      - name: Package Cookie Agent.app
        run: app/Scripts/package-app.sh "${{ runner.temp }}/Cookie Agent.app"

      - name: Render popup previews
        timeout-minutes: 2
        env:
          COOKIE_DATA_DIR: ${{ runner.temp }}/popup-preview-data
          COOKIE_RENDER_POPUP_PREVIEWS: ${{ runner.temp }}/popup-previews
        run: |
          mkdir -p "$COOKIE_DATA_DIR/logs" "$COOKIE_RENDER_POPUP_PREVIEWS"
          "${{ runner.temp }}/Cookie Agent.app/Contents/MacOS/CookieAgent"
          python3 - "$COOKIE_RENDER_POPUP_PREVIEWS" <<'PY'
          import struct, sys
          from pathlib import Path

          root = Path(sys.argv[1])

          def points(name):
              data = (root / name).read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{name} is not a png")
              width, height = struct.unpack(">II", data[16:24])
              scale = 2 if width >= 1000 else 1
              return width / scale, height / scale

          empty_w, empty_h = points("popup-empty.png")
          short_w, short_h = points("popup-short.png")
          long_w, long_h = points("popup-long.png")
          if abs(empty_w - 560) > 2 or abs(short_w - 560) > 2 or abs(long_w - 560) > 2:
              raise SystemExit(f"width {empty_w} {short_w} {long_w}")
          if not (40 < empty_h < 80):
              raise SystemExit(f"empty height {empty_h}")
          if not (empty_h < short_h < 320):
              raise SystemExit(f"short height {short_h}")
          if abs(long_h - 320) > 1:
              raise SystemExit(f"long height {long_h}")
          print(f"popup previews empty {empty_h:.0f} short {short_h:.0f} long {long_h:.0f}")
          PY

      - name: Upload popup previews
        uses: actions/upload-artifact@v4
        with:
          name: popup-previews
          path: ${{ runner.temp }}/popup-previews/popup-*.png
          if-no-files-found: error

  type-strip-warning:
    name: Type-stripping stderr (Node 22.13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22.13
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Type-stripping warning stays off stderr
        env:
          COOKIE_EXPECT_TYPE_STRIP_WARNING: "1"
        run: node core/scripts/check-type-strip-stderr.mjs

  sqlite-spike:
    name: better-sqlite3 spike (Node 22.13, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: macos-26
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22.13
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          # No pnpm store cache. A warm store links better-sqlite3 without
          # running its install script, and this job requires that script's
          # prebuild line in the log.

      - name: Install dependencies from the prebuild
        run: |
          bindir="${{ runner.temp }}/no-toolchain/bin"
          log="${{ runner.temp }}/pnpm-install.log"
          mkdir -p "$bindir"
          for tool in gcc g++ cc c++ clang clang++ make node-gyp node-gyp-build cmake; do
            printf '%s\n' '#!/bin/sh' 'echo "TOOLCHAIN_INVOKED $0 $*" >&2' 'exit 1' > "$bindir/$tool"
            chmod +x "$bindir/$tool"
          done
          export PATH="$bindir:$PATH"
          set +e
          pnpm install --frozen-lockfile > "$log" 2>&1
          code=$?
          cat "$log"
          set -e
          test "$code" -eq 0
          if grep -q TOOLCHAIN_INVOKED "$log"; then
            echo "a compiler or node-gyp ran during install" >&2
            exit 1
          fi
          if grep -q "prebuild-install || node-gyp rebuild --release" "$log"; then
            echo "install script ran: prebuild-install || node-gyp rebuild --release"
          else
            echo "install script was not reprinted; pnpm reused a store entry"
            binary="core/node_modules/better-sqlite3/build/Release/better_sqlite3.node"
            if [ ! -f "$binary" ]; then
              binary="$(find node_modules -path '*/better-sqlite3/build/Release/better_sqlite3.node' -type f -print -quit)"
            fi
            test -f "$binary"
            file "$binary"
          fi

      - name: Require runner architecture
        run: |
          echo "runner.os=${{ runner.os }} runner.arch=${{ runner.arch }} uname=$(uname -m)"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            test "$(uname -m)" = "arm64"
            test "${{ runner.arch }}" = "ARM64"
          else
            test "$(uname -m)" = "x86_64"
            test "${{ runner.arch }}" = "X64"
          fi

      - name: Spike better-sqlite3
        run: pnpm spike-sqlite
